<a class="bubble" href="{{ .Permalink }}">
    <i class="fas fa-fw {{or .Params.icon "fab fa-video" }}"></i>
</a>

<article class="video">
    {{ partial "featured-image" . }}

    {{ with .Params.youtube }}
    <div class="responsive-video youtube">
        <iframe src="https://www.youtube-nocookie.com/embed/{{ . }}?rel=0" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
    </div>
    {{ end }}
    {{ with .Params.vimeo }}
    <div class="responsive-video vimeo">
        <iframe src="https://player.vimeo.com/video/{{ . }}" frameborder="0" webkitallowfullscreen mozallowfullscreen
            allowfullscreen></iframe>
    </div>
    {{ end }}
    {{ with .Params.prezi }}
    <div class="responsive-video prezi">
        <iframe src="https://prezi.com/embed/{{ . }}/" frameborder="0" webkitallowfullscreen mozallowfullscreen
            allowfullscreen></iframe>
    </div>
    {{ end }}

    {{ if isset .Params "mp4video" }}
    <div>
      <video class="js-player" width="100%" playsinline controls controls data-plyr-config='{ "title": "{{ .Title }}" }' data-poster="{{ .Params.mp4videoImage }}">
        <source src="{{ .Params.mp4video }}" type="video/mp4">
        <track kind="captions" label="BSÇE Türkçe" srclang="tr" src="{{ .Params.mp4videoSub }}">
      </video>
    </div>
    {{ end }}

    {{ with .Params.iframe }}
    <div class="responsive-video youtube">
        <iframe src="{{ . }}" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
    </div>
    {{ end }}
    
    {{ partial "default-content.html" . }}
    {{ partial "article-footer" . }}
</article>
