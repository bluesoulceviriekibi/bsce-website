{{ if ne .Paginator.TotalPages 0 }}
    <div class="paginator">
        {{ if .Paginator.HasPrev }}
            <a href="{{ .Paginator.Prev.URL }}" class="newer"><i class="fa fa-angle-double-left"></i>{{ i18n "newerPosts" }}</a>
        {{ end }}

	{{ if .Paginator.HasNext }}
            <a href="{{ .Paginator.Next.URL }}" class="older">{{ i18n "olderPosts" }}<i class="fa fa-angle-double-right"></i></a>
        {{ end }}
    </div>
{{ end }}
