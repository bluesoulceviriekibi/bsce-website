---
new_page_extension: md
auto_deploy: false
admin_path: static/admin
webhook_url: ''
sections:
- type: directory
  path: content
  label: Pages
  create: all
  match: "*"
- type: directory
  path: content/yazi
  label: Yazi
  create: all
  match: "**/*"
- type: directory
  path: content/video
  label: Video
  create: all
  match: "**/*"
- type: directory
  path: content/sayfa
  label: Sayfa
  create: all
  match: "**/*"
- type: directory
  path: content/poke-preview
  label: Poke preview
  create: all
  match: "**/*"
- type: directory
  path: content/oyun
  label: Oyun
  create: all
  match: "**/*"
upload_dir: static/media
public_path: "/media"
front_matter_path: ''
use_front_matter_path: false
file_template: ":filename:"
build:
  preview_env:
  - HUGO_ENV=staging
  - HUGO_VERSION=0.74.3
  preview_output_directory: public
  preview_docker_image: forestryio/hugo:latest
  mount_path: "/srv"
  working_dir: "/srv"
  instant_preview_command: hugo server --ignoreCache --disableFastRender -D -E -F
    --renderToDisk -d public
version: 0.74.3
