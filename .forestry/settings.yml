---
new_page_extension: md
auto_deploy: false
admin_path: "/static/admin"
webhook_url: ''
sections:
- type: directory
  path: content/oyun
  label: Oyun
  create: all
  match: "**/*"
  exclude: _index*
  templates:
  - oyun
- type: directory
  path: content/video
  label: Video
  create: all
  match: "**/*"
  exclude: _index*
  templates:
  - video_youtube
  - video_mp4
  - video_iframe
- type: directory
  path: content/anime
  label: Anime
  create: all
  match: "**/*"
  exclude: _index*
  templates:
  - anime_thumbnail
  - anime_mp4
  - anime_iframe
- type: directory
  path: content/duyuru
  label: Duyuru
  create: all
  match: "**/*"
  exclude: _index*
  templates:
  - yazi
- type: directory
  path: content/sayfa
  label: Sayfa
  create: all
  match: "**/*"
  exclude: _index*
  templates:
  - sayfa
- type: directory
  path: content/indir
  label: İndirme Linki
  create: all
  match: "**/*"
  exclude: _index*
  templates:
  - indir
upload_dir: website/assets
public_path: https://res.cloudinary.com/bluesoulceviriekibi/image/upload
front_matter_path: ''
use_front_matter_path: false
file_template: ":filename:"
build:
  preview_env:
  - HUGO_ENV=development
  - HUGO_VERSION=0.82.1
  preview_output_directory: public
  preview_docker_image: forestryio/hugo:latest
  mount_path: "/srv"
  working_dir: "/srv"
  instant_preview_command: hugo server --gc --ignoreCache --disableFastRender --cleanDestinationDir
    -w -D --renderToDisk -d public
version: 0.82.1
