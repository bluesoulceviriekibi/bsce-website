name: Deployment

on:
  push:
    branches: [ master ]
  delete:
    branches: [ master ]
  create:
    branches: [ master ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
    
    - uses: actions/checkout@master

    - name: Mirror Repo
      uses: wei/git-sync@master
      with:
        source_repo: "https://omerakgoz34:${{ secrets.TOKEN }}@github.com/bluesoulceviriekibi/website.git"
        source_branch: "master"
        destination_repo: "https://omerakgoz34:${{ secrets.TOKEN }}@github.com/omerakgoz34/bsce-website.git"
        destination_branch: "master"

  algolia:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@master
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.74.3"
          extended: true
          
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "algoliasearch>=2.0,<3.0"

      - name: Build Site
        run: hugo --minify --ignoreCache

      - name: Upload Algolia Index
        run: ./upload_aloglia_index.sh
